# LLM-Fux Configuration
# Choose ONE mode: single_run OR batch_run. Set enabled: true for the mode you want.
# Then run: poetry run run

# =============================================================================
# GLOBAL SETTINGS (applied to all runs)
# =============================================================================

# API Settings
timeout: 600               # API timeout in seconds (600 = 10 minutes, 0 = no timeout)

# LOCKED — Do not modify model identifiers without explicit approval.
# These are the canonical model versions used for all experiments.
default_models:
  openai: gpt-5.4
  anthropic: claude-opus-4-6
  google: gemini-3.1-pro-preview

# Per-model temperature defaults.
# Gemini 3: Google recommends keeping temperature at 1.0 (lowering may cause
# looping or degraded performance).  OpenAI & Anthropic: 0.0 for deterministic.
# These are used when no explicit temperature is provided in the run config.
model_temperatures:
  chatgpt: 0.0
  claude: 0.0
  gemini: 1.0

# Directory Settings (usually don't need to change these)
data_dir: ./data
dataset: ""
outputs_dir: ./outputs
max_tokens: 200000       # Global fallback max response length

# =============================================================================
# SINGLE RUN CONFIGURATION
# =============================================================================
# For testing one specific configuration
# Set enabled: true, configure your test, then run: poetry run run-config

single_run:
  enabled: false                   # Set to true to enable single run mode
  
  # Required
  file: Above_D       # File to test (e.g., Above_C)
  
  # Test configuration
  model: chatgpt                                         # chatgpt, claude, or gemini
  model_name:                                            # Specific model version (optional)
  datatype: musicxml                                     # musicxml
  
  # Path to guide file (e.g., data/guides/LLM-Guide.md)
  # `null` for no guide
  # To copy the path, right click the file you're looking for in VSCode and select "Copy Relative Path"
  guide_path: data/guides/1_first_species/1vs1_v1.2.txt

  # Model parameters
  temperature: 0.5         # 0.0-1.0. 0.0 for deterministic output, 1.0 for creative.
  max_tokens: 200000       # Maximum response length

# =============================================================================
# BATCH RUN CONFIGURATION
# =============================================================================
# For testing multiple combinations (models × datatypes × files × contexts)
# Set enabled: true, configure your tests, then run: poetry run run-config

batch_run:
  enabled: true            # Set to true to enable batch run mode
  
  # What to test (list one or more of each)
  models:                  # One or more: chatgpt, claude, gemini
    - claude
    - chatgpt
    # - gemini             # free tier quota exceeded — needs billing enabled

  datatypes:               # musicxml
    - musicxml

  files:                   # One or more file IDs
    - Above_C

  # Context configuration
  contexts:                # Options: with, without (can include both!)
    - with

  guide_path: "data/guides/5_fifth_species/Fux Rules- 5th species - Florish - v2.3.txt"

  # Model parameters
  temperature: 0.0         # 0.0-1.0
  max_tokens: 200000       # Maximum response length
  
  # Execution settings
  delay: 2                 # Seconds between API calls (respects rate limits)
  retry: 2                 # Retries on failure

# =============================================================================
# EXAMPLE CONFIGURATIONS
# =============================================================================
#
# Example 1: Test all models with MusicXML (no guide)
# batch_run:
#   enabled: true
#   models: [chatgpt, claude, gemini]
#   datatypes: [musicxml]
#   files: [Fux_CantusFirmus_C]
#   contexts: [without]
#
# Example 2: Test with Claude
# batch_run:
#   enabled: true
#   models: [claude]
#   datatypes: [musicxml]
#   files: [Fux_CantusFirmus_C]
#   contexts: [without]
#
# Example 3: Compare with/without context using LLM guide
# batch_run:
#   enabled: true
#   models: [claude]
#   datatypes: [musicxml]
#   files: [Fux_CantusFirmus_C]
#   contexts: [with, without]
#   guide_path: data/guides/LLM-Guide.md
#
# Example 4: Full comparison matrix with custom guide
# batch_run:
#   enabled: true
#   models: [chatgpt, claude, gemini]
#   datatypes: [musicxml]
#   files: [Fux_CantusFirmus_C]
#   contexts: [with, without]
#   guide_path: data/guides/Pierre-Guide.md
